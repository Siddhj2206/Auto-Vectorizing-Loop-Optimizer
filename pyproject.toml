[project]
name = "avlo"
version = "0.1.0"
description = "Auto-Vectorizing Loop Optimizer: a scoped, inspectable IR-to-IR toy vectorizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
avlo = "avlo.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avlo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
