[project]
name = "avlo"
version = "0.1.0"
description = "Source-level C loop vectorizer with inspectable dependence analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pycparser>=3.11",
]

[project.scripts]
avlo = "avlo.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avlo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
